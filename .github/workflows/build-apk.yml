name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu 24.04 has the Android SDK preinstalled.
      # Avoid setup-android v3's extra license/repository refresh, which can fail.
      - name: Verify preinstalled Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "$ANDROID_HOME" || { echo 'Missing Android SDK'; exit 1; }
          ls -1 "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || {
            echo 'Preinstalled android-37.0 platform not found'
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/36.0.0" || {
            echo 'Build tools 36.0.0 missing'
            exit 1
          }
          # Android Gradle plugin may look for android-37 rather than android-37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanPilot-v1.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
