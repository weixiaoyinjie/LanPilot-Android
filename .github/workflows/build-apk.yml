name: Build LAN Pilot APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='LanPilot-Android-v1.0.1-SDK-fix.zip'
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not uploaded to the root of the repository"
            exit 1
          fi
          unzip -o -q "$ZIP" -d .
          test -f settings.gradle || { echo 'ERROR: settings.gradle is missing'; exit 1; }
          test -f build.gradle || { echo 'ERROR: build.gradle is missing'; exit 1; }
          test -f app/build.gradle || { echo 'ERROR: app/build.gradle is missing'; exit 1; }
          echo 'Android project extracted successfully'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
